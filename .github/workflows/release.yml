name: Build and Release HaxBall Multiplatform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          yes | sdkmanager --install "build-tools;34.0.0" "platforms;android-34"

      - name: Build APK
        run: |
          chmod +x build.sh
          export ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
          export PATH="$ANDROID_SDK_ROOT/build-tools/34.0.0:$PATH"
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          export KEYSTORE="debug.keystore"
          ./build.sh
          cp build/haxball-debug.apk haxball-v2.8.1.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haxball-android-apk
          path: haxball-v2.8.1.apk

  build-desktop-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Windows Installer & Portable (.exe)
        run: npm run dist:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haxball-windows
          path: dist/*.exe

  build-desktop-macos:
    name: Build macOS Desktop
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build macOS DMG & ZIP (.dmg, .zip)
        run: npm run dist:mac

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haxball-macos
          path: |
            dist/*.dmg
            dist/*.zip

  build-desktop-linux:
    name: Build Linux Desktop (DEB, RPM, AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install RPM and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot libarchive-tools

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Linux Packages (.deb, .rpm, .AppImage)
        run: npm run dist:linux

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haxball-linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

  publish-release:
    name: Publish Multiplatform Release
    needs: [build-android, build-desktop-windows, build-desktop-macos, build-desktop-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten Artifacts
        run: |
          mkdir -p release-files
          find release-assets -type f -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          name: "HaxBall Multiplatform v2.8.1"
          tag_name: ${{ github.ref_name || 'v2.8.1' }}
          draft: false
          prerelease: false
          body: |
            ## ⚽ HaxBall Mobile & Desktop Client v2.8.1

            ### 🎮 Yenilikler & Geliştirmeler
            - **Gerçek PC Klavye "Tık-Tık-Tık" Joystick Motoru (Pro-Tap Engine v2.8.1):**
              - Bilgisayarda 4 ok tuşuna (`ArrowUp`, `ArrowDown`, `ArrowLeft`, `ArrowRight`) saniyede defalarca "tık-tık-tık" basarak oynama mekaniği, joystick'i tam çekseniz bile basılı tutmaya dönüşmeden kesintisiz darbeli vuruş (pulse-tapping) yapacak şekilde yeniden yazıldı.
              - Joystick üzerinde basılan ok tuşlarını canlı gösteren **4 Yönlü Ok İndikatörü (`▲`, `▼`, `◀`, `▶`)** eklendi; her "tık" darbesinde ilgili ok tuşu parlar.
              - Parmağınızı sürükledikçe ivmeyi (`stepDx`, `stepDy`) anında hesaplayıp ok tuşlarına dinamik frekansta (6-16 Tık/sn ayarlanabilir) ve açı oranında ($\cos\theta$, $\sin\theta$) tıklar.
              - Ayarlar menüsüne **Ok Tuşu Tıklama Modu** (`Pro Tapping`, `%100 Tap`, `Klasik`) ve **Tık-Tık Hızı (6–16 Tık/sn)** kaydırıcısı eklendi.
            - **%100 Gboard (Sistem Klavyesi) Engellemesi & Gelişmiş Sanal Klavye:**
              - Android `WebView.onCreateInputConnection` seviyesinde donanımsal/native kilit eklendi; sohbet, kullanıcı adı, oda şifresi veya arama kutusuna dokunulduğunda Android ekran klavyesi (Gboard) kesinlikle açılmaz.
              - Özel sanal klavyeye **Büyük/Küçük Harf (`⇧ Shift`, Türkçe İ/I/Ğ/Ü/Ş/Ö/Ç destekli)** tuşu ve tüm oyun içi input'larla canlı senkronizasyon eklendi.
            - **Lobi & Menü Görünürlük Düzeltmesi ve Kritik Bug Fix:**
              - v2.8.0 sürümünde butonların ve sanal klavyenin çalışmasını engelleyen `currentKbMode` başlatma hatası giderildi ve eski OTA önbelleği otomatik temizlendi.
              - Lobi, oda listesi, kullanıcı adı seçimi ve ESC menüsünde joystick ve şut butonları otomatik gizlenir; yalnızca maç sahasında aktif olur.
            - **Masaüstü Sürümleri (Multiplatform Desktop Support):**
              - **Windows**: `.exe` (Kurulum Sihirbazı & Taşınabilir Sürüm)
              - **macOS**: `.dmg` & `.zip` (Apple Silicon & Intel)
              - **Linux**: `.deb` (Debian, Ubuntu, Linux Mint) ve `.rpm` (Fedora, RHEL, openSUSE) + `.AppImage`
              - **Android**: `.apk` (120 FPS / Full HD Mobil İstemci)
