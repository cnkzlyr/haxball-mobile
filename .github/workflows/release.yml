name: Build and Release HaxBall Multiplatform

# Fully automatic releases:
#  • Every push to main reads "version" from package.json. If the tag v<version>
#    does not exist yet, all platforms are built and a GitHub Release + tag
#    v<version> are created automatically. Pushes that don't bump the version
#    (and changes only to server/ or docs) do not rebuild.
#  • Pushing a v* tag manually still works.
#  • Actions → Run workflow (workflow_dispatch) always builds and (re)publishes
#    the release for the current package.json version.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'server/**'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Detect Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Decide whether to release
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            RELEASE=true
          else
            TAG="v${VERSION}"
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              RELEASE=true
            elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag ${TAG} already exists – version not bumped, skipping release."
              RELEASE=false
            else
              RELEASE=true
            fi
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION} | Tag: ${TAG} | Release: ${RELEASE}"

  build-android:
    name: Build Android APK
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # The runner image already ships the Android SDK; setup-android@v3 broke
      # because it tries to install the removed 'tools' package.
      - name: Install Android Build Tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_JAR=$SDK/platforms/android-34/android.jar" >> "$GITHUB_ENV"
          echo "$SDK/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          chmod +x build.sh
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          export KEYSTORE="debug.keystore"
          ./build.sh
          cp build/haxball-debug.apk "haxball-v${{ needs.version.outputs.version }}.apk"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haxball-android-apk
          path: haxball-v*.apk

  build-desktop:
    name: Build Desktop (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: dist:win
            artifact: haxball-windows
            files: dist/*.exe
          - name: macOS
            os: macos-latest
            script: dist:mac
            artifact: haxball-macos
            files: |
              dist/*.dmg
              dist/*.zip
          - name: Linux
            # ubuntu-24.04: rpm 6 on newer images breaks electron-builder's bundled fpm
            os: ubuntu-24.04
            script: dist:linux:main
            artifact: haxball-linux
            files: |
              dist/*.deb
              dist/*.rpm
              dist/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no Apple signing certificate
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install RPM and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot libarchive-tools

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run ${{ matrix.script }} -- --publish never

      # .rpm is built separately so a packaging failure never blocks .deb / .AppImage
      - name: Build RPM
        if: runner.os == 'Linux'
        continue-on-error: true
        run: npx electron-builder --linux rpm --publish never

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish-release:
    name: Publish Multiplatform Release
    needs: [version, build-android, build-desktop]
    # Publish whatever built successfully, as long as the APK is there
    if: always() && needs.version.outputs.release == 'true' && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten Artifacts
        run: |
          mkdir -p release-files
          find release-assets -type f -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          name: "HaxBall Multiplatform ${{ needs.version.outputs.tag }}"
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: 'true'
